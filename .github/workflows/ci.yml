# Format check, lint and every test, exactly as ./t.sh runs them: in the
# `test` image, with PostgreSQL for the contract tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # the release workflow runs the same checks before publishing

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built here, with a cache, so that compose below finds the image and
      # does not build it again.
      - name: Build the test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          tags: audio-scribe-test
          load: true
          cache-from: type=gha,scope=test
          cache-to: type=gha,scope=test,mode=max

      - name: Lint and test
        run: docker compose -f compose.test.yaml run --rm test
