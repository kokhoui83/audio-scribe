[project]
name = "audio-scribe"
version = "0.1.0"
description = "Folder-watching audio transcription with speaker diarization"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "tests/features"
markers = [
    "postgres: needs a PostgreSQL database (TEST_DATABASE_URL)",
    "ffmpeg: needs the ffmpeg binary",
]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
